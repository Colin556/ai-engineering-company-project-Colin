services:
  ui:
    build:
      context: ./uis
      target: production
    env_file: !override
      - path: ./.env
        required: true
    environment:
      NEXT_PUBLIC_API_BASE_URL: /backend
      API_INTERNAL_URL: http://backend:8000
    volumes: !reset []
    restart: unless-stopped

  backend:
    env_file: !override
      - ./.env
      - ./services/api/.env
    volumes: !override
      - backend_data:/data
    ports: !override
      - "127.0.0.1:8000:8000"
    restart: unless-stopped