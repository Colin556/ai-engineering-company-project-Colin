[project]
name = "brasaland-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "libpass[bcrypt]>=1.9",
    "pydantic[email]>=2.10",
    "python-dotenv>=1.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "tinydb>=4.8",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
seed = "suppliers:run_seed"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "accounts",
    "core",
    "emails",
    "incident_analysis",
    "incident_catalog",
    "incidents",
    "main",
    "models",
    "suppliers",
]